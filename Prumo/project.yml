name: Prumo
include:
  - path: Configuracao/icloud.yml
    enable: ${PERITY_ICLOUD}
options:
  bundleIdPrefix: ${PERITY_BUNDLE_PREFIX}
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: pt-BR
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Vem do arquivo Configuracao.local (veja Scripts/configurar.sh). Pode ficar vazio: escolha a equipe no Xcode.
    DEVELOPMENT_TEAM: ${PERITY_TEAM_ID}
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  PrumoCore:
    path: PrumoCore
targets:
  Prumo:
    type: application
    platform: iOS
    sources:
      - path: App/Shared
      - path: App/iOS
        excludes: [".gitkeep"]
    dependencies:
      - package: PrumoCore
      - target: PrumoWidget
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Perity
        PerityServicoCofre: ${PERITY_BUNDLE_PREFIX}.prumo
        PerityGrupoApp: group.${PERITY_BUNDLE_PREFIX}.prumo
        CFBundleName: Perity
        # Fundo preto enquanto o app carrega, para a abertura animada não começar com um clarão branco.
        UILaunchScreen:
          UIColorName: FundoAbertura
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.finance
    entitlements:
      path: App/iOS/Prumo.entitlements
      properties:
        com.apple.security.application-groups: ["group.${PERITY_BUNDLE_PREFIX}.prumo"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${PERITY_BUNDLE_PREFIX}.prumo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  PrumoMac:
    type: application
    platform: macOS
    sources:
      - path: App/Shared
      - path: App/macOS
    dependencies:
      - package: PrumoCore
      - target: PrumoWidgetMac
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: Perity
        PerityServicoCofre: ${PERITY_BUNDLE_PREFIX}.prumo
        PerityGrupoApp: group.${PERITY_BUNDLE_PREFIX}.prumo
        CFBundleName: Perity
        LSApplicationCategoryType: public.app-category.finance
        LSMinimumSystemVersion: "14.0"
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/macOS/PrumoMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups: ["group.${PERITY_BUNDLE_PREFIX}.prumo"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${PERITY_BUNDLE_PREFIX}.prumo
        PRODUCT_NAME: Prumo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
  PrumoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: ["*.plist", "*.entitlements"]
    dependencies:
      - package: PrumoCore
    info:
      path: Widgets/Info-iOS.plist
      properties:
        CFBundleDisplayName: Perity
        PerityServicoCofre: ${PERITY_BUNDLE_PREFIX}.prumo
        PerityGrupoApp: group.${PERITY_BUNDLE_PREFIX}.prumo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/PrumoWidget-iOS.entitlements
      properties:
        com.apple.security.application-groups: ["group.${PERITY_BUNDLE_PREFIX}.prumo"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${PERITY_BUNDLE_PREFIX}.prumo.widget
        PRODUCT_NAME: PrumoWidget
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
  PrumoWidgetMac:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets
        excludes: ["*.plist", "*.entitlements"]
    dependencies:
      - package: PrumoCore
    info:
      path: Widgets/Info-macOS.plist
      properties:
        CFBundleDisplayName: Perity
        PerityServicoCofre: ${PERITY_BUNDLE_PREFIX}.prumo
        PerityGrupoApp: group.${PERITY_BUNDLE_PREFIX}.prumo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/PrumoWidget-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: ["group.${PERITY_BUNDLE_PREFIX}.prumo"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${PERITY_BUNDLE_PREFIX}.prumo.widget
        PRODUCT_NAME: PrumoWidget
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Prumo:
    build:
      targets:
        Prumo: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  PrumoMac:
    build:
      targets:
        PrumoMac: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
